<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="Moja korpa - početna stranica">
      <span class="brand-mark" aria-hidden="true">m</span>
      <span class="brand-name">Moja korpa</span>
    </a>
    <span class="topbar-note">Kolekcija i finansije</span>
  </header>

  <main class="main-content" id="main-content">
    <router-outlet></router-outlet>
  </main>

  <nav class="bottom-nav" aria-label="Glavna navigacija">
    <a
      routerLink="/"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" />
      </svg>
      <span>Početna</span>
    </a>
    <a routerLink="/kategorije" routerLinkActive="is-active" ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" />
      </svg>
      <span>Kategorije</span>
    </a>
    <a routerLink="/proizvodi" routerLinkActive="is-active" ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 7h14l1 14H4L5 7Z" />
        <path d="M9 7a3 3 0 0 1 6 0" />
      </svg>
      <span>Proizvodi</span>
    </a>
    <a routerLink="/kupovina" routerLinkActive="is-active" ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.4L22 8H6" />
        <circle cx="10" cy="21" r="1" />
        <circle cx="18" cy="21" r="1" />
      </svg>
      <span>Kupovina</span>
    </a>
    <a routerLink="/finansije" routerLinkActive="is-active" ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 19V5m0 14h16" />
        <path d="m7 15 3-4 3 2 5-6" />
      </svg>
      <span>Finansije</span>
    </a>
    <a routerLink="/profil" routerLinkActive="is-active" ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21a8 8 0 0 1 16 0" />
      </svg>
      <span>Profil</span>
    </a>
  </nav>
</div>
