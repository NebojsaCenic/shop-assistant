<section class="profile-page">
  <div class="page-heading">
    <p class="eyebrow">TVOJ NALOG</p>
    <h1>Profil</h1>
    <p class="description">Osnovne informacije o tvom nalogu.</p>
  </div>

  <div class="profile-card">
    <span class="profile-label">Imejl adresa</span>
    <p class="profile-email">{{ auth.currentUser()?.email ?? 'Imejl adresa nije dostupna.' }}</p>
  </div>

  @if (errorMessage(); as message) {
    <p class="error-message" role="alert">{{ message }}</p>
  }

  <button class="sign-out-button" type="button" [disabled]="isSigningOut()" (click)="signOut()">
    {{ isSigningOut() ? 'Odjavljivanje…' : 'Odjavi se' }}
  </button>
</section>
